name: Build Android APK

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Unzip project
        run: unzip temp_number_sms_starter.zip

      - name: Build APK with Gradle
        run: |
          cd temp_number_sms_starter/android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: temp_number_sms_starter/android/app/build/outputs/apk/debug/app-debug.apk
